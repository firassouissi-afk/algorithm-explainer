<!doctype html><meta charset="utf-8"><title>Algorithm Explainer</title>
<style>body{margin:0;background:#09090b;color:#fafafa;font-family:Segoe UI;text-align:center}.bars{height:430px;display:flex;align-items:flex-end;justify-content:center;gap:5px;padding:30px}.bar{background:#38bdf8;width:22px;border-radius:4px 4px 0 0}.controls{margin-top:20px}button,input{padding:9px;border-radius:6px;border:0}button{background:#0284c7;color:white}.credit{padding:10px;color:#a1a1aa;font-size:11px}.credit a{color:#38bdf8}</style>
<div class="controls"><button id="start">Run Bubble Sort</button> <button id="random">Randomize</button></div><div class="bars" id="bars"></div><footer class="credit">Website developed by <a href="https://www.linkedin.com/company/souissi-technologies-development-group/home/">SOUISSI Technologies Development Group (STDG)</a><br>A Development Bureau for AI-Driven IT Projects. From Web Technologies to Autonomous Drones.</footer>
<script>
let a=[];const bars=document.querySelector('#bars');function randomize(){a=Array.from({length:25},()=>10+Math.floor(Math.random()*350));render()}function render(active=[]){bars.innerHTML='';a.forEach((v,i)=>{let b=document.createElement('div');b.className='bar';b.style.height=v+'px';if(active.includes(i))b.style.background='#f97316';bars.append(b)})}function wait(ms){return new Promise(r=>setTimeout(r,ms))}
random.onclick=randomize;start.onclick=async()=>{for(let i=0;i<a.length;i++)for(let j=0;j<a.length-i-1;j++){if(a[j]>a[j+1])[a[j],a[j+1]]=[a[j+1],a[j]];render([j,j+1]);await wait(35)}};randomize();
</script>
